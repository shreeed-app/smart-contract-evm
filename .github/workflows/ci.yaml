name: Continuous integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.9.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome + ESLint
        run: bun run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome format check
        run: bunx biome format .

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge format check
        run: forge fmt --check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [lint, format]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Hardhat node
        run: setsid -f bunx hardhat node < /dev/null > /dev/null 2>&1

      - name: Wait for JSON-RPC
        run: bunx wait-on -t 60000 tcp:127.0.0.1:8545

      - name: Compile contracts
        run: bun run compile

      - name: Deploy to localhost
        run: bun run deploy

      - name: Run tests
        run: bun run test

      - name: Stop Hardhat node
        if: always()
        run: pkill -f "hardhat node" 2>/dev/null || true
